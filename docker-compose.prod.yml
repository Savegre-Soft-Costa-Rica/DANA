# ---------------------------------------------------------------------------
# Producción: app + MongoDB, sin puertos de la base expuestos, datos en volúmenes.
#   cp .env.example .env   (edite las variables)
#   docker compose -f docker-compose.prod.yml up -d --build
#   App: http://servidor:9000  → ponga delante un proxy con HTTPS (Caddy, Nginx, Traefik).
# ---------------------------------------------------------------------------
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-dana}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Defina MONGO_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER:-dana}", "-p", "${MONGO_PASSWORD}", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build:
      context: .
      target: final
    image: ${DANA_IMAGE:-dana:latest}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${DANA_PORT:-9000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-America/Costa_Rica}
      Mongo__ConnectionString: mongodb://${MONGO_USER:-dana}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      Mongo__Database: ${MONGO_DB:-dana}
      Authentication__AllowRegistration: ${ALLOW_REGISTRATION:-true}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Authentication__Google__AllowedDomains__0: ${GOOGLE_ALLOWED_DOMAIN:-}
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__User: ${SMTP_USER:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__Smtp__From: ${SMTP_FROM:-}
      Email__Smtp__FromName: ${SMTP_FROM_NAME:-Dana CRM}
    volumes:
      - uploads:/app/App_Data
      - keys:/app/keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Copia de seguridad diaria de MongoDB en ./backups (mongodump comprimido, conserva 14 días)
  backup:
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          mongodump --uri="mongodb://${MONGO_USER:-dana}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin" --db=${MONGO_DB:-dana} --archive=/backups/dana-$$(date +%F-%H%M).gz --gzip \
            && find /backups -name 'dana-*.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  mongo-data:
  uploads:
  keys:
