# ---------------------------------------------------------------------------
# Producción: app + MongoDB + copia de seguridad diaria.
#   docker compose -f docker-compose.prod.yml up -d --build
# En Coolify, las credenciales se definen en Environment Variables con su
# NOMBRE FINAL (el que lee .NET), sin variables intermedias:
#   Authentication__Google__ClientId        = <client id de Google>
#   Authentication__Google__ClientSecret    = <client secret de Google>
#   (opcional) Authentication__Google__AllowedDomains__0 = savegresoft.com
#   (opcional) Authentication__AllowRegistration = false
# Mongo sí usa variables de compose porque se arman dentro de la cadena de conexión.
# ---------------------------------------------------------------------------
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-dana}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Defina MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_USER:-dana}", "-p", "${MONGO_PASSWORD}", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  app:
    build:
      context: .
      target: final
    image: ${DANA_IMAGE:-dana:latest}
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      # Fijos
      ASPNETCORE_ENVIRONMENT: Production
      TZ: ${TZ:-America/Costa_Rica}
      Mongo__ConnectionString: mongodb://${MONGO_USER:-dana}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      Mongo__Database: ${MONGO_DB:-dana}
      # Definidas en Coolify con su nombre final (vacías aquí = se toman del entorno/Coolify).
      # Google OAuth2 — necesarias para el botón "Continuar con Google":
      Authentication__Google__ClientId:
      Authentication__Google__ClientSecret:
      # Registro abierto (por defecto true si no se define):
      Authentication__AllowRegistration:
    volumes:
      - uploads:/app/App_Data
      - keys:/app/keys
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Copia de seguridad diaria de MongoDB en ./backups (conserva 14 días)
  backup:
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          mongodump --uri="mongodb://${MONGO_USER:-dana}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin" --db=${MONGO_DB:-dana} --archive=/backups/dana-$$(date +%F-%H%M).gz --gzip \
            && find /backups -name 'dana-*.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  mongo-data:
  uploads:
  keys:
